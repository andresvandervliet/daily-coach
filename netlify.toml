[build]
  command = "node verify-finance.cjs && node verify-rollover.cjs && node verify-storage.cjs && node verify-settings.cjs && node verify-responsive.cjs && node build.cjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
