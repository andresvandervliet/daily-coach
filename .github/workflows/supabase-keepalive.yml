# Houdt het gratis Supabase-project actief.
# Supabase pauzeert gratis projecten na 7 dagen zonder verkeer.
# Deze workflow doet elke 3 dagen één kleine leesaanvraag, zodat dat niet gebeurt.
#
# URL en sleutel zijn dezelfde publieke anon-waarden als in index.html
# (rol "anon", alleen wat Row Level Security toestaat). Geen geheimen nodig.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 */3 * *" # om de 3 dagen, 06:17 UTC
  workflow_dispatch: {} # handmatig starten via het tabblad Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://psdtqbulxfyarowtjgex.supabase.co
      SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzZHRxYnVseGZ5YXJvd3RqZ2V4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NDI3NTYsImV4cCI6MjEwMjAxODc1Nn0.CpcTMtnkiZVvBj86T6syYM2RWJ6gmDR08ixR-PyhjYA
    steps:
      - name: Ping Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/daily_entries?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase antwoordde met HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase gaf HTTP $status. Is het project gepauzeerd? Herstel het via supabase.com/dashboard."
            exit 1
          fi
